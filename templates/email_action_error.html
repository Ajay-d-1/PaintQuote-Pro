<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — PaintQuote Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background:#f3f4f6; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:'Inter',sans-serif; }
        .card { background:white; border-radius:16px; padding:3rem; text-align:center; max-width:480px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.1); border-top:4px solid #ef4444; }
        h1 { font-size:1.5rem; font-weight:800; color:#991b1b; margin:1rem 0 0.75rem; }
        p { color:#6b7280; font-size:0.95rem; line-height:1.6; }
        a { color:#1e40af; font-weight:600; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size:3.5rem">⚠️</div>
        <h1>Action Failed</h1>
        <p>{{ error }}</p>
        <p style="margin-top:1.5rem">
            <a href="/approval-queue">View Approval Queue →</a>
            &nbsp;·&nbsp;
            <a href="/dashboard">Dashboard</a>
